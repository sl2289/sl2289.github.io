# Sections on the Design page.
# order: smaller number = shown first (also the order in the "On This Page" sidebar).
#        To move 3D/Motion to the top, just change the numbers — no need to move the blocks.
# label: the section name, used everywhere — the heading on the Design page, the
#        "On This Page" sidebar, the category page heading and "← Back to …" links.
# A project's `category` in its index.md must match one of these ids (don't rename an id:
# it is part of the URL).
- id: mr
  order: 2
  label: "XR & Spatial Interaction"
  description: "Immersive experiences, spatial interfaces, and gesture-based interactions."
- id: ux
  order: 3
  label: "UX Research & Interaction Design"
  description: "Human-centered research, interface design, and AI-assisted interactive systems."
- id: 3d-motion
  order: 1
  label: "Visual & Motion Design"
  description: "Visual communication, 3D modeling, and motion graphics."
